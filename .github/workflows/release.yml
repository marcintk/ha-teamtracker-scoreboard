name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: npm

      - run: npm ci
      - run: npm run build:prod

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/card.js
          generate_release_notes: true
