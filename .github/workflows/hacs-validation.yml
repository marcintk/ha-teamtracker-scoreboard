name: HACS Validation

on:
  release:
    types: [published]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: HACS Action
        uses: hacs/action@main
        with:
          category: plugin
