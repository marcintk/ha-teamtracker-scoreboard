<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e20"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141416" stop-opacity="0"/>
      <stop offset="100%" stop-color="#141416" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="card-clip">
      <rect x="28" y="28" width="444" height="444" rx="24" ry="24"/>
    </clipPath>
  </defs>

  <!-- App icon background -->
  <rect width="500" height="500" rx="80" ry="80" fill="url(#bg)"/>

  <!-- Card surface (clipped) -->
  <g clip-path="url(#card-clip)">

    <!-- ── NBA SECTION ── -->
    <rect x="28" y="28" width="444" height="54" fill="#1c1c1e"/>
    <text x="48" y="63" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#2196F3">NBA</text>
    <line x1="48" y1="76" x2="192" y2="76" stroke="#2196F3" stroke-width="2" opacity="0.35"/>

    <!-- ROW 1: Final -->
    <rect x="28" y="82" width="444" height="56" fill="#242426"/>
    <!-- Home -->
    <text x="48" y="103" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Spurs</text>
    <text x="48" y="121" font-family="Arial, sans-serif" font-size="11" fill="#606060">62-20</text>
    <!-- Score centered at x=250 -->
    <text x="238" y="107" text-anchor="end" font-family="Arial, sans-serif" font-size="24" font-weight="900" fill="#aaaaaa">104</text>
    <text x="250" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#505050">:</text>
    <text x="262" y="107" text-anchor="start" font-family="Arial, sans-serif" font-size="24" font-weight="900" fill="#ffffff">105</text>
    <text x="250" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#888888">Final</text>
    <!-- Away -->
    <text x="390" y="103" text-anchor="end" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#909090">Knicks</text>
    <text x="390" y="121" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#606060">53-29</text>

    <!-- ROW 2: Pre-game + TV badge -->
    <rect x="28" y="138" width="444" height="56" fill="#1c1c1e"/>
    <text x="48" y="159" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Lakers</text>
    <text x="48" y="177" font-family="Arial, sans-serif" font-size="11" fill="#606060">44-38</text>
    <text x="238" y="163" text-anchor="end" font-family="Arial, sans-serif" font-size="20" fill="#3a3a3a">–</text>
    <text x="250" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#3a3a3a">:</text>
    <text x="262" y="163" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#3a3a3a">–</text>
    <text x="250" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#505050">in 3h</text>
    <text x="390" y="159" text-anchor="end" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#909090">Celtics</text>
    <text x="390" y="177" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#606060">61-21</text>
    <!-- TV badge -->
    <rect x="406" y="148" width="50" height="18" rx="3" fill="#2a2a2e" stroke="#3a3a3a" stroke-width="1"/>
    <text x="431" y="161" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#707070">ESPN</text>

    <!-- ── NHL SECTION ── -->
    <rect x="28" y="194" width="444" height="40" fill="#1c1c1e"/>
    <text x="48" y="223" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#2196F3">NHL</text>
    <line x1="48" y1="230" x2="188" y2="230" stroke="#2196F3" stroke-width="2" opacity="0.35"/>

    <!-- ROW 3: LIVE + TV -->
    <rect x="28" y="234" width="444" height="56" fill="#242426"/>
    <text x="48" y="255" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Knights</text>
    <text x="48" y="273" font-family="Arial, sans-serif" font-size="11" fill="#606060">39-26-17</text>
    <text x="238" y="259" text-anchor="end" font-family="Arial, sans-serif" font-size="24" font-weight="900" fill="#ffffff">2</text>
    <text x="250" y="259" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#505050">:</text>
    <text x="262" y="259" text-anchor="start" font-family="Arial, sans-serif" font-size="24" font-weight="900" fill="#c0392b">3</text>
    <!-- LIVE badge -->
    <rect x="224" y="266" width="52" height="16" rx="3" fill="#8b2020"/>
    <text x="250" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="800" fill="#ffffff" letter-spacing="1">LIVE</text>
    <text x="390" y="255" text-anchor="end" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#909090">Canes</text>
    <text x="390" y="273" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#606060">53-22-7</text>
    <!-- TV badge -->
    <rect x="406" y="243" width="50" height="18" rx="3" fill="#2a2a2e" stroke="#3a3a3a" stroke-width="1"/>
    <text x="431" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#707070">ABC</text>

    <!-- ── WORLD CUP SECTION ── -->
    <rect x="28" y="290" width="444" height="40" fill="#1c1c1e"/>
    <text x="48" y="319" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#2196F3">World Cup</text>
    <line x1="48" y1="326" x2="242" y2="326" stroke="#2196F3" stroke-width="2" opacity="0.35"/>

    <!-- ROW 4 -->
    <rect x="28" y="330" width="444" height="50" fill="#242426"/>
    <text x="48" y="350" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Spain</text>
    <text x="48" y="368" font-family="Arial, sans-serif" font-size="11" fill="#606060">0-0-0</text>
    <text x="238" y="354" text-anchor="end" font-family="Arial, sans-serif" font-size="20" fill="#3a3a3a">–</text>
    <text x="250" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#3a3a3a">:</text>
    <text x="262" y="354" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#3a3a3a">–</text>
    <text x="250" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#505050">in 5 days</text>
    <text x="390" y="350" text-anchor="end" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#909090">Brazil</text>
    <text x="390" y="368" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#606060">0-0-0</text>

    <!-- ROW 5 -->
    <rect x="28" y="380" width="444" height="50" fill="#1c1c1e"/>
    <text x="48" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">USA</text>
    <text x="48" y="418" font-family="Arial, sans-serif" font-size="11" fill="#606060">0-0-0</text>
    <text x="238" y="404" text-anchor="end" font-family="Arial, sans-serif" font-size="20" fill="#3a3a3a">–</text>
    <text x="250" y="404" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#3a3a3a">:</text>
    <text x="262" y="404" text-anchor="start" font-family="Arial, sans-serif" font-size="20" fill="#3a3a3a">–</text>
    <text x="250" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#505050">in 6 days</text>
    <text x="390" y="400" text-anchor="end" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#909090">Germany</text>
    <text x="390" y="418" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#606060">0-0-0</text>

    <!-- ROW 6 partial + fade -->
    <rect x="28" y="430" width="444" height="42" fill="#242426"/>
    <text x="48" y="450" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" opacity="0.25">Mexico</text>
    <text x="390" y="450" text-anchor="end" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#909090" opacity="0.25">Canada</text>

    <!-- Fade to bottom -->
    <rect x="28" y="400" width="444" height="72" fill="url(#fade)"/>

  </g>

  <!-- Outer rounded border for polish -->
  <rect width="500" height="500" rx="80" ry="80" fill="none" stroke="#2a2a2c" stroke-width="2"/>
</svg>
