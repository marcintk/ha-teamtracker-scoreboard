<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Background gradient: deep navy to charcoal -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1b2d"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>

    <!-- Scoreboard panel gradient -->
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2a3a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Home team score glow -->
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Away team score glow -->
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- LED dot pattern for score digits -->
    <filter id="led">
      <feComponentTransfer>
        <feFuncA type="linear" slope="1"/>
      </feComponentTransfer>
    </filter>

    <!-- Subtle inner shadow for panel -->
    <filter id="inner-shadow">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="500" height="500" rx="72" ry="72" fill="url(#bg)"/>

  <!-- Subtle grid lines (scoreboard texture) -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="500" y2="100"/>
    <line x1="0" y1="200" x2="500" y2="200"/>
    <line x1="0" y1="300" x2="500" y2="300"/>
    <line x1="0" y1="400" x2="500" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
  </g>

  <!-- Main scoreboard panel -->
  <rect x="36" y="110" width="428" height="280" rx="20" ry="20" fill="url(#panel)" stroke="#2d3f55" stroke-width="1.5"/>

  <!-- Top label bar -->
  <rect x="36" y="110" width="428" height="44" rx="20" ry="20" fill="#162032"/>
  <rect x="36" y="132" width="428" height="22" fill="#162032"/>

  <!-- "SCOREBOARD" label -->
  <text x="250" y="138" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="6" fill="#4a7fa5" opacity="0.9">SCOREBOARD</text>

  <!-- Divider line under label -->
  <line x1="56" y1="154" x2="444" y2="154" stroke="#2d3f55" stroke-width="1"/>

  <!-- HOME team section (left) -->
  <!-- Team color accent bar -->
  <rect x="56" y="164" width="6" height="140" rx="3" fill="#3b82f6"/>

  <!-- HOME label -->
  <text x="155" y="185" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#6b9ec8" opacity="0.85">HOME</text>

  <!-- HOME score: "3" -->
  <text x="155" y="285" text-anchor="middle" font-family="'Courier New', 'Consolas', monospace" font-size="110" font-weight="900" fill="#60a5fa" filter="url(#glow-blue)" opacity="0.95">3</text>

  <!-- AWAY team section (right) -->
  <!-- Team color accent bar -->
  <rect x="438" y="164" width="6" height="140" rx="3" fill="#ef4444"/>

  <!-- AWAY label -->
  <text x="345" y="185" text-anchor="middle" font-family="'Arial Narrow', Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#c87070" opacity="0.85">AWAY</text>

  <!-- AWAY score: "1" -->
  <text x="345" y="285" text-anchor="middle" font-family="'Courier New', 'Consolas', monospace" font-size="110" font-weight="900" fill="#f87171" filter="url(#glow-red)" opacity="0.95">1</text>

  <!-- Center divider column -->
  <line x1="250" y1="164" x2="250" y2="304" stroke="#2d3f55" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Center colon separator -->
  <circle cx="250" cy="230" r="6" fill="#4a7fa5" opacity="0.7"/>
  <circle cx="250" cy="262" r="6" fill="#4a7fa5" opacity="0.7"/>

  <!-- Bottom status bar -->
  <rect x="56" y="312" width="388" height="54" rx="10" fill="#0d1a28"/>

  <!-- Period indicator dots -->
  <circle cx="118" cy="339" r="5" fill="#3b82f6" opacity="0.9"/>
  <circle cx="138" cy="339" r="5" fill="#3b82f6" opacity="0.5"/>
  <circle cx="158" cy="339" r="5" fill="#3b82f6" opacity="0.25"/>
  <circle cx="178" cy="339" r="5" fill="#3b82f6" opacity="0.15"/>

  <!-- Period label -->
  <text x="118" y="357" font-family="'Arial Narrow', Arial, sans-serif" font-size="11" letter-spacing="2" fill="#4a7fa5" opacity="0.7">PERIOD</text>

  <!-- Clock display -->
  <text x="390" y="346" text-anchor="end" font-family="'Courier New', monospace" font-size="26" font-weight="700" fill="#60a5fa" opacity="0.85">12:34</text>

  <!-- Vertical separator in status bar -->
  <line x1="210" y1="318" x2="210" y2="360" stroke="#2d3f55" stroke-width="1"/>

  <!-- "LIVE" badge -->
  <rect x="220" y="326" width="50" height="24" rx="12" fill="#dc2626" opacity="0.85"/>
  <text x="245" y="343" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="2" fill="#ffffff">LIVE</text>

  <!-- Home Assistant logo hint: small circle at bottom -->
  <circle cx="250" cy="440" r="26" fill="none" stroke="#3b82f6" stroke-width="2.5" opacity="0.5"/>
  <circle cx="250" cy="440" r="10" fill="#3b82f6" opacity="0.6"/>
  <!-- HA house shape simplified -->
  <path d="M238 446 L238 436 L250 428 L262 436 L262 446 Z" fill="#1e3a5f" opacity="0.9"/>
  <path d="M234 438 L250 426 L266 438" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linejoin="round" opacity="0.9"/>

  <!-- Corner accent dots -->
  <circle cx="60" cy="114" r="3" fill="#3b82f6" opacity="0.3"/>
  <circle cx="440" cy="114" r="3" fill="#3b82f6" opacity="0.3"/>
  <circle cx="60" cy="386" r="3" fill="#3b82f6" opacity="0.3"/>
  <circle cx="440" cy="386" r="3" fill="#3b82f6" opacity="0.3"/>
</svg>
