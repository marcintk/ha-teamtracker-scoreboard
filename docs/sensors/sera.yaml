# Italian Serie A (SERA) — ha-teamtracker sensor definitions
#
# Roster: 2026/27 Serie A season (verified against ESPN, Sept 2026).
# All 20 clubs. Promoted from Serie B this season: Venezia, Frosinone, Monza.
# Relegated last season: Cremonese, Hellas Verona, Pisa.
#
# Soccer team_ids use the numeric ESPN team ID (recommended by ha-teamtracker
# for soccer leagues — abbreviations are inconsistent across competitions).
#
# This file is a complete `sensor:` block. Load it as a Home Assistant
# package (`homeassistant: packages: !include_dir_named packages/`), or
# paste its contents into configuration.yaml (only one `sensor:` key allowed).
# Delete any teams you don't want to track.
#
# After saving, restart Home Assistant (or reload YAML configuration).
# Each entry creates one entity, e.g. sensor.sera_juv, sensor.sera_mil, …
# Use the shared prefix  sensor.sera_  in the card's `prefix` field.

sensor:
  - platform: teamtracker
    league_id: "SERA"
    team_id: "105"
    name: "sera_ata" # Atalanta
