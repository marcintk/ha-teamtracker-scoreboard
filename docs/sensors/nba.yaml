# NBA — ha-teamtracker sensor definitions
#
# Roster: 2026/27 NBA season (verified against ESPN, Sept 2026). All 30 teams,
# grouped by division. No relocations or expansion since the 2024 season.
#
# This file is a complete `sensor:` block. Load it as a Home Assistant
# package (`homeassistant: packages: !include_dir_named packages/`), or
# paste its contents into configuration.yaml (only one `sensor:` key allowed).
# Delete any teams you don't want to track.
#
# After saving, restart Home Assistant (or reload YAML configuration).
# Each entry creates one entity, e.g. sensor.nba_bos, sensor.nba_lal, …
# Use the shared prefix  sensor.nba_  in the card's `prefix` field.

sensor:
