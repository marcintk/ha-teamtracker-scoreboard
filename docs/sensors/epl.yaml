# English Premier League (EPL) — ha-teamtracker sensor definitions
#
# Roster: 2026/27 Premier League season (verified against ESPN, Sept 2026).
# All 20 clubs. Promoted from the Championship this season: Coventry City,
# Ipswich Town, Hull City. Relegated last season: Wolves, Burnley, West Ham.
#
# Soccer team_ids use the numeric ESPN team ID (recommended by ha-teamtracker
# for soccer leagues — abbreviations are inconsistent across competitions).
#
# This file is a complete `sensor:` block. Load it as a Home Assistant
# package (`homeassistant: packages: !include_dir_named packages/`), or
# paste its contents into configuration.yaml (only one `sensor:` key allowed).
# Delete any teams you don't want to track.
#
# After saving, restart Home Assistant (or reload YAML configuration).
# Each entry creates one entity, e.g. sensor.epl_ars, sensor.epl_liv, …
# Use the shared prefix  sensor.epl_  in the card's `prefix` field.
# Suggested score_mode for this league: win-draw-loss.

sensor:
