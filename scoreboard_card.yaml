# Sports Scoreboard Card
#
# Prerequisites (all via HACS):
#   - ha-teamtracker integration (sensors)
#   - button-card + sport_tileboard_template
#   - config-template-card
#   - stack-in-card
#   - card-mod
#
# Configure the `sections` variable below to match your ha-teamtracker sensors.
#
# Each section:
#   name          - Header label shown above the section
#   prefix        - Entity ID prefix of your ha-teamtracker sensors (e.g. "sensor.nba_")
#   limit         - Max number of game rows to display
#   special_teams - Team abbreviations to highlight in orange (your favorites)
#   sortType      - "rank-win-loss"       for leagues with W/L records (NBA, NFL, ...)
#                   "rank-win-draw-loss"  for leagues with draws (NHL, soccer, ...)
#                   "earliest_date"       for tournaments / non-regular seasons

type: custom:config-template-card
entities:
  - sensor.sport_refresh_signal
variables:
  generated_team_cards: |-
    (() => {
      const VALID_STATES = new Set(['PRE', 'IN', 'POST', 'BYE']);

      // ---------------------------------------------------------------
      // CONFIGURE YOUR SECTIONS HERE
      // ---------------------------------------------------------------
      const sections = [
        { name: "NBA Scoreboard",  prefix: "sensor.nba_", limit: 10, special_teams: [],      sortType: 'rank-win-loss' },
        { name: "NHL Scoreboard",  prefix: "sensor.nhl_", limit: 5,  special_teams: [],      sortType: 'rank-win-draw-loss' },
        { name: "NFL Scoreboard",  prefix: "sensor.nfl_", limit: 10, special_teams: [],      sortType: 'rank-win-loss' },
      ];
      // ---------------------------------------------------------------

      const ratio = (numerator, total) => total ? numerator / total : 0;

      const calcRank = (pts, sortType) => {
        switch (sortType) {
          case 'rank-win-draw-loss': return ratio(2*pts[0] + pts[2], 2*pts[0] + pts[1] + pts[2]);
          default:                   return ratio(pts[0], pts[0] + pts[1]);
        }
      };

      const sortKey = (entityId, sortType) => {
        const attr = states[entityId]?.attributes;
        switch (sortType) {
          case 'earliest_date': return new Date(attr?.date ?? 0).getTime();
          default:              return calcRank((attr?.team_record ?? '0-0-0').split('-').map(Number), sortType);
        }
      };

      const preferHome = (list) => [...list].sort((a, b) =>
        (states[a.entityId]?.attributes?.team_homeaway === 'home' ? 0 : 1) -
        (states[b.entityId]?.attributes?.team_homeaway === 'home' ? 0 : 1)
      );

      const deduplicate = (list, sortType) => {
        if (sortType !== 'earliest_date') return list;
        const seen = new Set();
        return preferHome(list).filter(({ entityId }) => {
          const { date, team_abbr, opponent_abbr } = states[entityId]?.attributes ?? {};
          const key = `${date}_${[team_abbr, opponent_abbr].sort().join('_')}`;
          return seen.has(key) ? false : !!seen.add(key);
        });
      };

      const toCard = ({ entityId, special }) => ({
        type: 'custom:button-card',
        template: 'sport_tileboard_template',
        variables: { entity: entityId, visible: true, special }
      });

      const buildSection = ({ name, prefix, limit, special_teams, sortType }) => {
        const header = {
          type: "custom:button-card",
          name,
          styles: {
            card: [{ height: "18px" }, { padding: "0px" }, { "box-shadow": "none" }],
            name: [{ color: "#2196F3" }, { "font-size": "16px" }, { "justify-self": "start" }, { padding: "4px 2px 4px 2px" }]
          }
        };

        const firstEntity = Object.keys(states).find(e => e.startsWith(prefix) && VALID_STATES.has(states[e]?.state));
        const effectiveSortType = sortType !== 'earliest_date' && states[firstEntity]?.attributes?.season !== 'regular'
          ? 'earliest_date'
          : sortType;

        const cards = deduplicate(
          Object.keys(states)
            .filter(e => e.startsWith(prefix) && VALID_STATES.has(states[e]?.state))
            .map(entityId => ({ entityId, special: special_teams.includes(entityId.replace(prefix, '')), sortKey: sortKey(entityId, effectiveSortType) }))
            .sort((a, b) => {
              switch (effectiveSortType) {
                case 'earliest_date': return a.sortKey - b.sortKey;
                default:              return b.sortKey - a.sortKey;
              }
            }),
          effectiveSortType
        ).slice(0, limit).map(toCard);

        return cards.length ? [header, ...cards] : [];
      };

      return sections.flatMap(buildSection);
    })()
card_mod:
  style: "stack-in-card { --stack-card-gap: 0px; }"
card:
  type: custom:stack-in-card
  mode: vertical
  cards: ${generated_team_cards}
  card_mod:
    style: |
      ha-card {
        --stack-card-gap: 0px;
        height: 475px !important;
        min-height: 475px !important;
        max-height: 475px !important;
      }
